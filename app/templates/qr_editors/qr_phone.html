{% extends "base.html" %}
{% block title %}Phone QR — QRWaver{% endblock %}
{% block content %}

<section class="container block">
    <h1 style="font-size:1.8rem; margin-bottom:10px;">Phone QR Generator</h1>
    <p class="muted" style="margin-bottom:30px;">
        Enter a full phone number including country code. Scanning will start a call automatically.
    </p>

    <div class="qr-editor-grid">

        <!-- LEFT -->
        <div class="qr-controls">

            <label class="lbl" for="phone-full">Phone number</label>
            <input id="phone-full" type="text" placeholder="+359888123456" />

            <div class="row2" style="margin-top:25px;">
                <div>
                    <label class="lbl">Frame color</label>
                    <input type="color" id="frame-color" value="#000000"/>
                </div>
                <div>
                    <label class="lbl">Download format</label>
                    <select id="qr-format">
                        <option value="png">PNG (High-Res)</option>
                        <option value="jpeg">JPEG (High-Res)</option>
                        <option value="svg">SVG (Vector)</option>
                    </select>
                </div>
            </div>

            <!-- Frames -->
            <div class="frame-picker">
                <div class="lbl" style="margin-bottom:8px;">Frame</div>
                <div class="thumb-grid" id="frame-thumbs" data-selected="none">
                    <button class="thumb selected" data-frame="none">
                        <div class="thumb-none">No<br>frame</div>
                    </button>

                    <button class="thumb" data-frame="frame_2parts">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/two_parts_96.png') }}" alt="">
                    </button>

                    <button class="thumb" data-frame="frame_whole">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/rounded_96.png') }}" alt="">
                    </button>

                    <button class="thumb" data-frame="frame_bag">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/bag_96.png') }}" alt="">
                    </button>

                    <button class="thumb" data-frame="frame_phone">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/phone_96.png') }}" alt="">
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="qr-preview-wrap">
            <div id="qr-preview" class="qr-preview">
                <p class="muted">Your QR will appear here</p>
            </div>

            <div class="qr-buttons">
                <button id="downloadBtn" class="btn-flat btn-download" disabled>Download</button>
                <button id="shareBtn" class="btn-flat btn-share" disabled>Share</button>
            </div>
        </div>

    </div>
</section>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const phone = document.getElementById("phone-full");

    initQRGenerator("phone");

    phone.addEventListener("input", () => window.scheduleQRUpdate());

    window.getQRInputData = function () {
        return phone.value.trim().replace(/\s+/g, "");
    };
});
</script>

{% endblock %}

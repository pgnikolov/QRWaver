{% extends "base.html" %}
{% block title %}Website QR — QRWaver{% endblock %}
{% block content %}

<section class="container block">
    <h1 style="font-size:1.8rem; margin-bottom:10px;">Website QR Generator</h1>
    <p class="muted" style="margin-bottom:30px;">Enter your website — preview updates instantly. Pick a frame if you want.</p>

    <div class="qr-editor-grid">

        <!-- Left: Controls -->
        <div class="qr-controls">

            <label for="qr-text" class="lbl">Enter your website</label>
            <textarea id="qr-text" rows="3" placeholder="https://"></textarea>

            <div class="row2">
                <div>
                    <label for="frame-color" class="lbl">Frame color</label>
                    <input type="color" id="frame-color" value="#000000"/>
                </div>
                <div>
                    <label class="lbl" for="qr-format">Download format</label>
                    <select id="qr-format">
                        <option value="png">PNG (High-Res)</option>
                        <option value="jpeg">JPEG (High-Res)</option>
                        <option value="svg">SVG (Vector)</option>
                    </select>
                </div>
            </div>

            <!-- Frame picker -->
            <div class="frame-picker">
                <div class="lbl" style="margin-bottom:8px;">Frame</div>

                <div class="thumb-grid" id="frame-thumbs" data-selected="none">

                    <!-- No frame -->
                    <button class="thumb selected" data-frame="none" aria-label="No frame">
                        <div class="thumb-none">No<br>frame</div>
                    </button>

                    <!-- Frames -->
                    <button class="thumb" data-frame="frame_2parts">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/two_parts_96.png') }}" alt="Two Parts">
                    </button>

                    <button class="thumb" data-frame="frame_whole">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/rounded_96.png') }}" alt="Rounded">
                    </button>

                    <button class="thumb" data-frame="frame_bag">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/bag_96.png') }}" alt="Bag">
                    </button>

                    <button class="thumb" data-frame="frame_phone">
                        <img src="{{ url_for('static', filename='images/frames_thumbs/phone_96.png') }}" alt="Phone">
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Preview + Actions -->
        <div class="qr-preview-wrap">
            <div id="qr-preview" class="qr-preview">
                <p class="muted">Your QR will appear here</p>
            </div>

            <div class="qr-buttons">
                <button id="downloadBtn" class="btn-flat btn-download" disabled>
                    Download
                </button>

                <button id="shareBtn" class="btn-flat btn-share" disabled>
                    Share
                </button>
            </div>
        </div>

    </div>
</section>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>
    initQRGenerator("url");
</script>

{% endblock %}

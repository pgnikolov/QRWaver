{% extends "base.html" %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='images/branding/logo_wordmark.png') }}" alt="QRWaver"/>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">It only takes a minute</p>

    <form id="register-form" class="auth-form" novalidate>
      <label class="form-field">
        <span>Name (optional)</span>
        <input type="text" name="name" placeholder="Your name">
      </label>

      <label class="form-field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>

      <label class="form-field password-field">
        <span>Password</span>
        <div class="password-input">
          <input type="password" name="password" placeholder="At least 8 characters" required>
          <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
        </div>
        <small class="muted">Use 8+ characters with a mix of letters, numbers & symbols.</small>
      </label>

      <label class="form-field password-field">
        <span>Confirm password</span>
        <div class="password-input">
          <input type="password" name="confirm_password" placeholder="Re-enter password" required>
          <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
        </div>
      </label>

      <div class="form-row between">
        <label class="checkbox">
          <input type="checkbox" required> <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
        </label>
      </div>

      <button type="submit" class="btn-primary w-full">Create account</button>
    </form>

    <div class="divider"><span>or</span></div>

    <a href="{{ url_for('auth.google_login') }}" class="btn-google w-full">
      <img src="{{ url_for('static', filename='images/icons/google.svg') }}" alt=""/>
      Sign up with Google
    </a>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
  </div>
</section>

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
{% endblock %}

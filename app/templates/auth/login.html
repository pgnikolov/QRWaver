{% extends "base.html" %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='images/branding/logo_wordmark.png') }}" alt="QRWaver"/>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to access your dashboard</p>

    <form id="login-form" class="auth-form" novalidate>
      <label class="form-field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>

      <label class="form-field password-field">
        <span>Password</span>
        <div class="password-input">
          <input type="password" name="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
        </div>
      </label>

      <div class="form-row between">
        <label class="checkbox">
          <input type="checkbox"> <span>Remember me</span>
        </label>
        <a class="muted" href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary w-full">Log In</button>
    </form>

    <div class="divider"><span>or</span></div>

    <a href="{{ url_for('auth.google_login') }}" class="btn-google w-full">
      <img src="{{ url_for('static', filename='images/icons/google.svg') }}" alt=""/>
      Continue with Google
    </a>

    <p class="auth-switch">Don’t have an account? <a href="{{ url_for('auth.register_page') }}">Create one</a></p>
  </div>
</section>

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
{% endblock %}

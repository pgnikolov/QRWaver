<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>{% block title %}QRWaver — Create stylish QR codes{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for QR icon in scanner preview -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
    <link rel="icon" href="{{ url_for('static', filename='images/icons/qr.svg') }}">
</head>
<body style="font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #111827;">

<!-- Header -->
<header class="site-header">
  <div class="nav-container">
    <a href="/" class="logo">
      <img src="{{ url_for('static', filename='images/branding/logo_wordmark.png') }}" alt="QRWaver">
    </a>

    <nav class="main-nav">
      <ul>
        <li><a href="{{ url_for('main.index') }}">QR Codes</a></li>
        <li><a href="{{ url_for('api.ping') }}">API</a></li>
        <li><a href="#">Why QRWaver?</a></li>
        <li><a href="#">Docs</a></li>
        <li><a href="#" class="btn">Dashboard</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="main-content">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-inner">
        <span>© 2025 QRWaver · All rights reserved</span>
        <div class="footer-links">
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
            <a href="https://github.com/pgnikolov/QRWaver">GitHub</a>
        </div>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
